# Netlify Configuration for GHC Digital Twin

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"

# API calls are proxied to the backend service
[[redirects]]
  from = "/api/*"
  to = "https://ghc-digital-twin.onrender.com/api/:splat"
  status = 200
  force = true
